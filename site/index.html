<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Daily Briefing</title>
  <meta name="description" content="A daily digest of AI news: company announcements, open problems, models, research and policy.">
  <meta property="og:title" content="AI Daily Briefing">
  <meta property="og:description" content="A daily digest of AI news: company announcements, open problems, models, research and policy.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5fbf'/%3E%3Cpath d='M9 22V10h3.2l3.8 7 3.8-7H23v12h-2.8v-7.4L16.9 21h-1.8l-3.3-6.4V22z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      const theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (_) {}
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <h1><a href="./">AI Daily Briefing</a></h1>
        <p class="tagline" id="tagline">A daily digest of AI news</p>
      </div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle colour theme" title="Toggle colour theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <div class="toolbar" role="search">
    <div class="toolbar-inner">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search headlines, summaries, sources" aria-label="Search" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div class="filters">
        <div class="chips" id="section-chips" role="group" aria-label="Sections"></div>
        <div class="filter-row">
          <label class="date-field">From <input id="date-from" type="date"></label>
          <label class="date-field">To <input id="date-to" type="date"></label>
          <label class="toggle"><input id="figures-only" type="checkbox"> With figures</label>
          <button class="text-button" id="clear-filters" type="button" hidden>Clear filters</button>
        </div>
      </div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </div>
  </div>

  <main id="feed" class="feed" aria-busy="true">
    <p class="empty">Loading briefings…</p>
  </main>

  <div class="more"><button class="button" id="load-more" type="button" hidden>Show older briefings</button></div>

  <footer class="footer">
    <p>Written each morning by a scheduled Claude Code routine · <a href="https://github.com/AlkaidCheng/ai-daily-briefing">Source on GitHub</a></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
